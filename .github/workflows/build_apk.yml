name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Postavljanje Jave
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Postavljanje Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generiranje Android projekta
        run: flutter create . --platforms=android --org com.apartmani

      - name: Instalacija paketa
        run: flutter pub get

      - name: Podešavanje Android SDK, Gradle i R8
        run: |
          # 1. Postavljanje točne verzije 9.3.1-bin.zip sa services.gradle.org mirrora
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          fi

          # 2. Podešavanje minSdkVersion na 21 za ML Kit kameru
          find android/app/ -name "build.gradle*" | while read -r file; do
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$file"
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' "$file"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' "$file"
          done

          # 3. Zaključavanje NDK verzije i onemogućavanje R8 u build.gradle.kts
          python3 -c '
          import os, re

          path = "android/app/build.gradle.kts"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              # Zaključavanje NDK verzije na predinstaliranu verziju
              if "ndkVersion" not in content:
                  content = re.sub(r"android\s*\{", "android {\n    ndkVersion = \"27.0.12077973\"", content, count=1)

              # Onemogućavanje R8 minifikacije i shrinkanja resursa
              content = content.replace("getByName(\"release\") {", "getByName(\"release\") {\n            isMinifyEnabled = false\n            isShrinkResources = false")
              content = content.replace("release {", "release {\n            isMinifyEnabled = false\n            isShrinkResources = false")

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Uspješno konfiguriran build.gradle.kts")
          '

          # 4. Postavljanje AndroidX oznaka
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Izrada APK instalacije
        run: flutter build apk --release

      - name: Spremanje gotovog APK-a
        uses: actions/upload-artifact@v4
        with:
          name: apartman-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
