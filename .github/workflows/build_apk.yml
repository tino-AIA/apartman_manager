name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Postavljanje Jave
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Najnoviji stabilni Flutter koji nativno rješava Flutter Gradle AGP 8+ kompatibilnost
      - name: Postavljanje Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Generiramo samo nedostajuću Android platformsku mapu
      - name: Generiranje Android projekta
        run: flutter create . --platforms=android --org com.apartmani --project-name apartman_manager

      - name: Podešavanje Android SDK verzija
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Instalacija paketa
        run: flutter pub get

      # Izravno presretanje i zamjena sporne linije u CI pub-cacheu
      - name: Zakrpa za app_links
        run: |
          find /home/runner/ -name "build.gradle" 2>/dev/null | grep "app_links" | while read -r file; do
            echo "Pronadjen: $file"
            sed -i 's/project.android.flutter.compileSdkVersion.toInteger()/34/g' "$file"
            sed -i 's/project.android.flutter.compileSdkVersion/34/g' "$file"
          done

      - name: Izrada APK instalacije
        run: flutter build apk --release

      - name: Spremanje gotovog APK-a
        uses: actions/upload-artifact@v4
        with:
          name: apartman-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
