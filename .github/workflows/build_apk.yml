name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Postavljanje Jave
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Postavljanje Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generiranje Android projekta
        run: flutter create . --platforms=android --org com.apartmani

      - name: Instalacija paketa
        run: flutter pub get

      - name: Podešavanje Android SDK i isključivanje R8
        run: |
          # 1. Podešavanje minSdkVersion na 21 za ML Kit kameru
          find android/app/ -name "build.gradle*" | while read -r file; do
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$file"
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' "$file"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' "$file"
          done

          # 2. Onemogućavanje R8 minifikacije u build.gradle.kts
          python3 -c '
          import os

          path = "android/app/build.gradle.kts"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()

              # Isključujemo minifikaciju i shrink unutar buildTypes bloka
              content = content.replace("getByName(\"release\") {", "getByName(\"release\") {\n            isMinifyEnabled = false\n            isShrinkResources = false")
              content = content.replace("release {", "release {\n            isMinifyEnabled = false\n            isShrinkResources = false")

              with open(path, "w") as f:
                  f.write(content)
              print("R8 uspješno isključen u build.gradle.kts")
          '

          # 3. Postavljanje AndroidX oznaka
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Izrada APK instalacije
        run: flutter build apk --release

      - name: Spremanje gotovog APK-a
        uses: actions/upload-artifact@v4
        with:
          name: apartman-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
