name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Postavljanje Jave
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Postavljanje Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generiranje Android projekta
        run: flutter create . --platforms=android --org com.apartmani

      - name: Instalacija paketa
        run: flutter pub get

      - name: Podešavanje Android SDK i Gradle postavki
        run: |
          # 1. Popravak app_links ako postoji stari build.gradle
          find /home/runner/ -name "build.gradle" 2>/dev/null | grep "app_links" | while read -r file; do
            sed -i 's/project.android.flutter.compileSdkVersion.toInteger()/34/g' "$file"
            sed -i 's/project.android.flutter.compileSdkVersion/34/g' "$file"
          done

          # 2. Podešavanje minSdkVersion na 21 za ML Kit kameru
          find android/app/ -name "build.gradle*" | while read -r file; do
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$file"
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' "$file"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' "$file"
          done

          # 3. Postavljanje AndroidX svojstava
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Izrada APK instalacije
        run: flutter build apk --release --no-shrink

      - name: Spremanje gotovog APK-a
        uses: actions/upload-artifact@v4
        with:
          name: apartman-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
