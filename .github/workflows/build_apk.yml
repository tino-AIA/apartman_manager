name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Postavljanje Jave
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Postavljanje Fluttera
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Generiranje Android projekta
        run: flutter create . --platforms=android --org com.apartmani

      - name: Instalacija paketa
        run: flutter pub get

      # 1. Popravak build.gradle unutar samog app_links paketa u pub cacheu
      # 2. Podešavanje minSdkVersion i compileSdkVersion u glavnoj aplikaciji
      - name: Zakrpa za Gradle i app_links
        run: |
          # Popravak linije koja ruši app_links
          find /home/runner/.pub-cache/hosted/pub.dev/ -name "build.gradle" -path "*/app_links*/*" -exec sed -i 's/.*compileSdkVersion.*flutter.*/    compileSdkVersion 34/g' {} +
          
          # Podešavanje glavnog app/build.gradle
          sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 34/g' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle
          sed -i 's/targetSdkVersion = flutter.targetSdkVersion/targetSdkVersion = 34/g' android/app/build.gradle

      - name: Izrada APK instalacije
        run: flutter build apk --release

      - name: Spremanje gotovog APK-a
        uses: actions/upload-artifact@v4
        with:
          name: apartman-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
