name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Postavljanje Jave
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Postavljanje Fluttera
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Generiranje Android projekta
        run: flutter create . --platforms=android --org com.apartmani

      - name: Instalacija paketa
        run: flutter pub get

      # Popravak: izravna zamjena spornog poziva u app_links i postavljanje SDK verzija
      - name: Zakrpa za app_links i Android SDK
        run: |
          # 1. Pronađi točnu datoteku app_links/android/build.gradle i zamijeni sporni redak
          python3 -c '
          import glob, os

          pattern = os.path.expanduser("~/.pub-cache/hosted/pub.dev/app_links-*/android/build.gradle")
          for path in glob.glob(pattern):
              with open(path, "r") as f:
                  content = f.read()
              # Zamjenjuje problematični poziv sigurnim brojem 34
              new_content = content.replace("project.android.flutter.compileSdkVersion.toInteger()", "34")
              new_content = new_content.replace("project.android.flutter.compileSdkVersion", "34")
              with open(path, "w") as f:
                  f.write(new_content)
              print(f"Zakrpan: {path}")
          '

          # 2. Podešavanje minSdkVersion i compileSdkVersion u android/app/build.gradle
          sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 34/g' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle
          sed -i 's/targetSdkVersion = flutter.targetSdkVersion/targetSdkVersion = 34/g' android/app/build.gradle

      - name: Izrada APK instalacije
        run: flutter build apk --release

      - name: Spremanje gotovog APK-a
        uses: actions/upload-artifact@v4
        with:
          name: apartman-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
