name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Postavljanje Jave 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Postavljanje Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generiranje Android projekta
        run: flutter create . --platforms=android --org com.apartmani

      - name: Instalacija paketa
        run: flutter pub get

      - name: Podešavanje Android SDK, Gradle, Lint i R8
        run: |
          # 1. Postavljanje minimalne podržane verzije Gradle 9.5.0-bin.zip
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.0-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          fi

          # 2. Podešavanje minSdkVersion na 21 za ML Kit kameru
          find android/app/ -name "build.gradle*" | while read -r file; do
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$file"
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' "$file"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' "$file"
          done

          # 3. Konfiguracija build.gradle.kts (NDK, R8 i isključivanje Linta za vanjske plugine)
          python3 -c '
          import os, re

          path = "android/app/build.gradle.kts"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              if "ndkVersion" not in content:
                  content = re.sub(r"android\s*\{", "android {\n    ndkVersion = \"27.0.12077973\"\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }", content, count=1)

              content = content.replace("getByName(\"release\") {", "getByName(\"release\") {\n            isMinifyEnabled = false\n            isShrinkResources = false")
              content = content.replace("release {", "release {\n            isMinifyEnabled = false\n            isShrinkResources = false")

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Uspješno konfiguriran build.gradle.kts")
          '

          # 4. Isključivanje lintVital zadataka za sve subprojekte (camera_android_camerax itd.)
          cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              tasks.matching { it.name.contains("lint", ignoreCase = true) }.configureEach {
                  enabled = false
              }
          }
          EOF

          # 5. Postavljanje AndroidX oznake
          echo "android.useAndroidX=true" >> android/gradle.properties

      - name: Izrada APK instalacije
        run: flutter build apk --release

      - name: Spremanje gotovog APK-a
        uses: actions/upload-artifact@v4
        with:
          name: apartman-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
