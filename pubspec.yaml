name: apartman_manager
description: "Aplikacija za male iznajmljivače: evidencija prometa, popis gostiju i printanje računa."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase Cloud sinkronizacija
  supabase_flutter: ^2.8.0

  # Formatiranje datuma i valuta (€)
  intl: ^0.19.0

  # Kamera i OCR skeniranje dokumenata
  camera: ^0.11.0+1
  google_mlkit_text_recognition: ^0.13.0
  permission_handler: ^11.3.1

  # Generiranje i dijeljenje PDF računa / Excel izvoza (usklađene verzije)
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^4.0.6
  path_provider: ^2.1.3
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
